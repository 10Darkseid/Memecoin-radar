let ac,mg,nb,tm,st=0,on=false,nt=0;
const NS=0.2,mf=m=>440*Math.pow(2,(m-69)/12);
const ML=[[67,0,72,0,76,74,72,0],[69,0,72,0,76,77,76,0],[72,0,77,0,81,79,77,0],[74,0,79,0,83,81,79,0]];
const BS=[36,33,41,43],CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62]];
function tone(t,f,d,ty,v,fc){const o=ac.createOscillator(),g=ac.createGain(),fl=ac.createBiquadFilter();o.type=ty;o.frequency.value=f;fl.type='lowpass';fl.frequency.value=fc;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(fl);fl.connect(g);g.connect(mg);o.start(t);o.stop(t+d+.05)}
function nz(t,d,v,hp){const s=ac.createBufferSource();s.buffer=nb;const f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=ac.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.15);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.25)}
function sched(){while(nt<ac.currentTime+.3){const b=st>>3,i=st&7,m=ML[b][i];
if(m){tone(nt,mf(m),NS*1.9,'sawtooth',.15,3200);tone(nt,mf(m),NS*1.9,'square',.05,1800)}
if(i%2===0)tone(nt,mf(BS[b]),NS*1.8,'sawtooth',.2,500);
if(i===0)CH[b].forEach(x=>tone(nt,mf(x),NS*7.5,'triangle',.06,1200));
if(i%4===0)kick(nt);if(i===2||i===6)nz(nt,.12,.35,1500);nz(nt,.04,i%2?.12:.06,7000);
nt+=NS;st=(st+1)%32}}
function setMus(v){const bt=$('mus');on=v;bt.classList.toggle('on',v);$('mt').textContent=v?'MUSIC ON':'MEME MUSIC';
if(v){if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();mg=ac.createGain();mg.gain.value=.5;mg.connect(ac.destination);nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
ac.resume();nt=ac.currentTime+.05;st=0;clearInterval(tm);tm=setInterval(sched,50)}
else if(ac){clearInterval(tm);ac.suspend()}}
$('mus').onclick=()=>setMus(!on);
document.addEventListener('visibilitychange',()=>{if(on&&ac){if(document.hidden){ac.suspend()}else{ac.resume();nt=ac.currentTime+.05}}});
function again(){$('res').innerHTML='';$('form').classList.remove('hidden');requestAnimationFrame(()=>$('form').classList.remove('out'));window.scrollTo({top:0,behavior:'smooth'})}
$('go').onclick=()=>{
  const u=$('u').value.trim().replace(/^@/,'').toLowerCase();
  $('res').innerHTML='';
  if(!/^[a-z0-9_]{1,15}$/.test(u)){alert('Enter a valid X username (letters, numbers, underscore, max 15).');return}
  if(!on)setMus(true);
  $('form').classList.add('out');
  setTimeout(()=>{$('form').classList.add('hidden');$('load').classList.remove('hidden')},450);
  setTimeout(()=>{$('load').classList.add('hidden');show(u)},2300);
};
const bg=$('bg');
for(let i=0;i<40;i++){const e=document.createElement('i');e.className='star';e.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*80}%;animation-delay:${Math.random()*3}s;animation-duration:${1.5+Math.random()*2.5}s`;bg.appendChild(e)}
const W=["$PEPE","$DOGE","MOON!","WAGMI","$BONK","LFG!","GM!","$WIF"],C=["#ffd60a","#08d9ff","#ff2e63","#39ff88","#ff7b00"];
W.forEach((w,i)=>{const e=document.createElement('span');e.className='fw';e.textContent=w;e.style.cssText=`left:${6+i*12}%;font-size:${22+Math.random()*22}px;--c:${C[i%5]};--r:${(Math.random()*30-15).toFixed(0)}deg;--d:${9+Math.random()*7}s;--dl:${-Math.random()*14}s`;bg.appendChild(e)});
</script>
</body>
</html>
